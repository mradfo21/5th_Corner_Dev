services:
  # Web service: the Flask API + standalone web game.
  #
  # NOTE: This is a `type: web` service so the API is reachable AND Render
  # health checks work against it. (Discord support has been removed; this
  # service is the web app only.)
  - type: web
    name: somewhere-game
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # `start_production.sh` serves the Flask API with gunicorn (production WSGI
    # server) instead of Flask's dev server with debug=True. Render's health
    # probe targets the API.
    startCommand: bash start_production.sh
    healthCheckPath: /api/health
    autoDeploy: true
    # Persistent disk for `sessions/` — without this, EVERYTHING under it
    # (game state, images/tapes, and the cost_tracker SQLite ledger at
    # sessions/_analytics/usage.db) is wiped on every deploy/restart, per
    # RENDER_STORAGE_LIMITATION.md. The admin Cost Analytics tab is only
    # trustworthy with this in place — otherwise "total spend" silently
    # resets to whatever's happened since the last deploy. 1GB is generously
    # sized for the SQLite ledger + a healthy number of session images/tapes;
    # bump sizeGB in the Render dashboard (or here) if it fills up.
    #
    # IMPORTANT: if this service was created via Render's "New -> Web
    # Service" flow (not "New -> Blueprint"), Render will NOT pick this up
    # from a plain git push — disks on an existing non-Blueprint service
    # have to be added by hand once: Settings -> Disks -> Add Disk -> name
    # `game-data`, mount path `/opt/render/project/src/sessions`, 1 GB. The
    # admin dashboard's Cost Analytics tab shows a live green/yellow/red
    # banner (backed by GET /api/admin/analytics/storage_health) telling you
    # definitively whether this is actually attached — check that instead of
    # assuming this block alone is sufficient. See RENDER_STORAGE_LIMITATION.md.
    disk:
      name: game-data
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
    envVars:
      # Cast & Camera reference plates (character sheets / level art uploaded in
      # World Studio) live inside the persistent disk mounted above, so they
      # survive deploys. Without this they'd default into the repo tree and be
      # wiped on every restart along with everything else outside `sessions/`.
      - key: REFERENCES_DIR
        value: /opt/render/project/src/sessions/_references
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Krea 2 image backend (DEFAULT). Create an API token at
      # krea.ai/settings/api-tokens. Powers the default image provider.
      # Optional tuning: KREA_CREATIVITY (raw|low|medium|high, default low),
      # KREA_STYLE_STRENGTH (0..1 style-reference carry-over, default 0.6).
      - key: KREA_API_KEY
        sync: false
      # fal.ai image backend (optional speed preset). Create an API key at
      # fal.ai/dashboard/keys. Only needed when the image provider is switched
      # to "fal" (SDXL Lightning) via the admin dashboard's AI MODELS switcher
      # or ai_config.json.
      - key: FAL_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Hosted Play is a cashier, not operator subsidy. Desktop play.py stays
      # BYOK via billing.mark_local_app() and must never inherit this flag.
      - key: FEATURE_BILLING
        value: "1"
      - key: SOMEWHERE_BILLING_PATH
        value: /opt/render/project/src/sessions/_billing/billing.json
      # Payments (docs/LAUNCH_PAYMENTS.md). With both Stripe keys set, hosted
      # play needs money in the browser's wallet; without them it's free on
      # our keys. Set the values in the Render dashboard, never in this file.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # The game's public address, for Stripe's return link (e.g.
      # https://play.5th-corner.com). Falls back to the request's host.
      - key: PUBLIC_BASE_URL
        sync: false
      # Markup on provider cost (2 = players pay twice what the models cost).
      - key: BILLING_MARKUP
        value: "2"
      # Reactor realtime world-model renderer (optional). REACTOR_API_KEY is a
      # secret used only server-side to mint short-lived browser tokens.
      - key: REACTOR_API_KEY
        sync: false
      # Voices — the narrator and TALK — are Gemini TTS on GEMINI_API_KEY
      # (speech.py); there is no separate voice key. The voice registry and
      # the narrator cast live in voices.json (committed); SOMEWHERE_VOICE /
      # SOMEWHERE_NARRATOR_VOICE / SOMEWHERE_TTS_MODEL optionally override the
      # defaults. Music and world sound are not generated: no provider on the
      # key makes them (music returns with Lyria — ONE_KEY_AUDIO_PLAN.md).
      # SDK model name for the DEFAULT world model (Happy Oyster — prompt-to-world
      # navigable real-time model). Steered by held movement/look + interaction
      # verbs, with our generated still passed as the world's first frame.
      - key: REACTOR_MODEL
        value: "reactor/happy-oyster"
      # Default world model the mid-game switcher starts on ("happy-oyster",
      # "lingbot-world-2", or "helios"). Players can flip between them live from
      # the WORLD MODEL log.
      - key: REACTOR_WORLD_MODEL
        value: "happy-oyster"
      # SDK model name for LingBot World 2 (the legacy seed-locked model).
      - key: REACTOR_LINGBOT_MODEL
        value: "reactor/lingbot-world-2"
      # SDK model name for Helios (a text/image-to-video blend model).
      - key: REACTOR_HELIOS_MODEL
        value: "reactor/helios"
      # Add/replace the entire advertised world-model list with pure config (no
      # code change) — a JSON array of {id,label,sdk_name,requires_seed_image,
      # protocol}. Leave unset to use the built-in list (happy-oyster,
      # lingbot-world-2, helios, lingbot, longlive-v2, sana-streaming). Lets us
      # ship a NEW Reactor model the moment it exists just by editing this value.
      - key: REACTOR_MODELS
        sync: false
      # Allow the web client to connect to ANY model name a tester types in, even
      # one not advertised above — so a brand-new Reactor model is usable instantly
      # ("1"/"true" to allow, "0"/"false" to lock to the advertised list).
      - key: REACTOR_ALLOW_CUSTOM_MODELS
        value: "1"
      # Default scene renderer: "reactor" (realtime video) or "image" (Gemini
      # stills). The web client auto-falls back to stills if Reactor is
      # unavailable, and can override per-session via ?renderer= / the toggle.
      - key: SCENE_RENDERER
        value: "reactor"
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
