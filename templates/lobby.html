<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOMEWHERE</title>
<meta name="description" content="You wake somewhere you don't recognise. No map, no way back, one life.">
<meta property="og:title" content="SOMEWHERE">
<meta property="og:description" content="AI-driven survival horror — every frame generated as you go.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#020504">
<link rel="icon" href="{{ url_for('static', filename='Logo.jpg') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"></noscript>
<link rel="stylesheet" href="{{ url_for('static', filename='css/standalone.css') }}?v={{ asset_version }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/lobby.css') }}?v={{ asset_version }}">
</head>
<body class="start-menu-on lobby-page">

  <div id="start-menu" class="start-menu" aria-label="Start" aria-busy="true">
    <div id="start-splash" class="start-splash" aria-hidden="true">
      <div class="start-splash-bar" aria-hidden="true"><i></i></div>
    </div>
    <div class="start-meta">
      <span id="lobby-clock" class="start-clock">--:--:--</span>
      <span id="comp-badge" class="start-comp" hidden></span>
    </div>

    <div id="start-signal" class="start-signal" aria-hidden="true">
      <video id="start-signal-video" class="start-signal-video"
             muted loop playsinline preload="none"></video>
      <canvas id="start-signal-canvas" class="start-signal-canvas"></canvas>
      <div id="start-signal-img" class="start-signal-img"></div>
      <div id="start-signal-img-b" class="start-signal-img"></div>
    </div>
    <div class="start-menu-inner">
      <div class="start-brand" id="start-brand">
        <span class="start-brand-type">SOMEWHERE</span>
      </div>
      <div class="start-sub">AI-driven survival horror &mdash; every frame generated as you go.</div>
      <div class="start-tiles">
        <button id="cta-start" class="start-tile" type="button"
                title="Start a fresh run and drop into the world.">
          <span class="start-tile-ico" aria-hidden="true">&#9654;</span>
          <span class="start-tile-name">PLAY</span>
        </button>
        <button id="start-create" class="start-tile" type="button"
                title="Open the studio — Worlds, Experiences, playtest.">
          <span class="start-tile-ico" aria-hidden="true">&#9998;</span>
          <span class="start-tile-name">CREATE</span>
        </button>
        <button id="cta-continue" class="start-tile" type="button"
                aria-expanded="false" aria-controls="panel-resume"
                title="Resume a saved run.">
          <span class="start-tile-ico" aria-hidden="true">&#9634;</span>
          <span class="start-tile-name">CONTINUE</span>
          <span class="start-tile-count" id="continue-badge" hidden>0</span>
        </button>
        <button id="start-account" class="start-tile" type="button"
                title="Keys, usage, and billing.">
          <span class="start-tile-ico" aria-hidden="true">&#9670;</span>
          <span class="start-tile-name">ACCOUNT</span>
        </button>
      </div>
      <span id="continue-hint" class="start-hint" hidden></span>
      <p class="run-form-error" id="new-run-error" role="alert" hidden></p>

      <section class="lobby-sheet" id="panel-resume" hidden>
        <div class="resume-list" id="resume-list" aria-live="polite">
          <div class="resume-empty" id="resume-empty">
            <span>Loading saved runs…</span>
          </div>
        </div>
        <div class="resume-join">
          <input type="text" id="resume-code" placeholder="paste a run code"
                 maxlength="40" spellcheck="false" pattern="[A-Za-z0-9_\-]+" autocomplete="off">
          <button type="button" id="resume-code-go" class="lobby-go">GO</button>
        </div>
      </section>

      <details class="lobby-options">
        <summary>Name this run <span class="opt">optional</span></summary>
        <form id="new-run-form" class="run-form" autocomplete="off">
          <label class="run-field">
            <span class="run-field-label">Name</span>
            <input type="text" id="new-run-name" name="name" maxlength="60"
                   placeholder="e.g. desert-fence-01" spellcheck="false">
          </label>
          <button type="button" id="advanced-toggle" class="advanced-toggle" aria-expanded="false" aria-controls="advanced-fields">
            <span class="advanced-toggle-caret" aria-hidden="true">▸</span> Pick your own code
          </button>
          <div class="advanced-fields" id="advanced-fields" hidden>
            <label class="run-field">
              <span class="run-field-label">Custom code</span>
              <input type="text" id="new-run-code" name="session_id" maxlength="40"
                     placeholder="letters, numbers, - and _" spellcheck="false" pattern="[A-Za-z0-9_\-]+">
            </label>
          </div>
          <button type="submit" class="start-tile lobby-confirm" id="new-run-submit">
            <span class="start-tile-ico" aria-hidden="true">&#9654;</span>
            <span class="start-tile-name">START THIS RUN</span>
          </button>
        </form>
      </details>
    </div>
  </div>

  <div id="boot-overlay" class="boot-overlay" hidden aria-hidden="true">
    <div class="start-splash-bar" aria-hidden="true"><i></i></div>
    <div class="boot-sr" id="boot-line" aria-live="polite"></div>
    <div class="boot-sr" id="boot-code"></div>
    <div class="boot-sr" id="boot-progress-fill"></div>
    <div class="boot-sr" id="boot-tip-text"></div>
  </div>

  <script src="{{ url_for('static', filename='js/lobby.js') }}?v={{ asset_version }}"></script>
</body>
</html>
