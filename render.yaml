services:
  # Single combined service: API + Discord bot.
  #
  # NOTE: The previous version of this file declared `type: worker`, which on
  # Render means no public URL and no inbound HTTP. That is incompatible with
  # the API server (`api.py`), the `/admin` dashboard, and Render health
  # checks. We use `type: web` so the API is reachable AND the bot keeps
  # running alongside it.
  - type: web
    name: somewhere-discord-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # `start_production.sh` launches the Discord bot in the background and
    # serves the Flask API with gunicorn (production WSGI server) instead of
    # Flask's dev server with debug=True. Don't change this without updating
    # both processes — Render's health probe targets the API.
    startCommand: bash start_production.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Krea 2 image backend (DEFAULT). Create an API token at
      # krea.ai/settings/api-tokens. Powers the default image provider.
      # Optional tuning: KREA_CREATIVITY (raw|low|medium|high, default low),
      # KREA_STYLE_STRENGTH (0..1 style-reference carry-over, default 0.6).
      - key: KREA_API_KEY
        sync: false
      # fal.ai image backend (optional speed preset). Create an API key at
      # fal.ai/dashboard/keys. Only needed when the image provider is switched
      # to "fal" (SDXL Lightning) via the admin dashboard's AI MODELS switcher,
      # the Discord /ai_switch command, or ai_config.json.
      - key: FAL_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Reactor realtime world-model renderer (optional). REACTOR_API_KEY is a
      # secret used only server-side to mint short-lived browser tokens.
      - key: REACTOR_API_KEY
        sync: false
      # ElevenLabs — powers the SCAN "TALK" mechanic (speak to people/characters
      # the scanner flags as able to talk) AND the NARRATOR stream (a voice that
      # frames the world, optionally as a multi-voice cast).
      #   • TALK voice works OUT OF THE BOX with no secret: the default AGENT_ID
      #     below is a PUBLIC conversational agent the browser connects to by id.
      #   • ELEVENLABS_API_KEY is needed for (a) NARRATOR audio — text-to-speech
      #     has no public path — and (b) pointing AGENT_ID at a PRIVATE agent
      #     (the server mints short-lived signed URLs; the key never reaches the
      #     browser). Without the key, TALK still speaks and the narrator degrades
      #     to on-screen subtitles.
      #   • Voice registry + narrator cast live in voices.json (committed).
      #     ELEVENLABS_VOICE_ID / ELEVENLABS_NARRATOR_VOICE_ID / ELEVENLABS_TTS_MODEL
      #     optionally override the defaults.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        value: "agent_1601kxh3rz2hej9swfs75dv33q78"
      # "0" if you repoint AGENT_ID at an agent that does NOT allow prompt/
      # first-message overrides in its Security settings (else the widget errors;
      # dynamic variables still keep it story-aware).
      - key: ELEVENLABS_ALLOW_OVERRIDES
        value: "1"
      # Dynamic per-character voices (voice_design.py + DYNAMIC_VOICES_PLAN.md).
      # When ON and ELEVENLABS_API_KEY is set, every SCAN subject gets a voice
      # DESIGNED from its own description (label + kind + scene + persona) via
      # ElevenLabs Voice Design, cached per session, and DELETED at session
      # end so the workspace's voice-slot quota stays bounded.
      # The first TALK line uses a hashed-per-subject fallback voice (so
      # different characters already sound different immediately); the
      # designed voice hot-swaps in for the NEXT AI turn without truncating
      # the current one. Set to "0" to fully disable (falls back to today's
      # by_kind roster only).
      - key: ELEVENLABS_DYNAMIC_VOICES
        value: "1"
      # Optional tuning (all safe defaults; unset uses the value in parens):
      #   ELEVENLABS_TTV_MODEL              (eleven_ttv_v3)
      #   ELEVENLABS_DESIGN_BUDGET_PER_SESSION (8)   — cap per session
      #   ELEVENLABS_DESIGN_CONCURRENCY        (3)   — process-wide semaphore
      #   ELEVENLABS_VOICE_SOFT_CAP            (auto from /v1/user/subscription)
      #   ELEVENLABS_VOICE_SWEEP_HOURS         (6)   — orphan sweep cadence
      #   ELEVENLABS_VOICE_MAX_AGE_HOURS       (24)  — orphan age cutoff
      # SDK model name for the DEFAULT world model (Happy Oyster — prompt-to-world
      # navigable real-time model). Steered by held movement/look + interaction
      # verbs, with our generated still passed as the world's first frame.
      - key: REACTOR_MODEL
        value: "reactor/happy-oyster"
      # Default world model the mid-game switcher starts on ("happy-oyster",
      # "lingbot-world-2", or "helios"). Players can flip between them live from
      # the WORLD MODEL log.
      - key: REACTOR_WORLD_MODEL
        value: "happy-oyster"
      # SDK model name for LingBot World 2 (the legacy seed-locked model).
      - key: REACTOR_LINGBOT_MODEL
        value: "reactor/lingbot-world-2"
      # SDK model name for Helios (a text/image-to-video blend model).
      - key: REACTOR_HELIOS_MODEL
        value: "reactor/helios"
      # Add/replace the entire advertised world-model list with pure config (no
      # code change) — a JSON array of {id,label,sdk_name,requires_seed_image,
      # protocol}. Leave unset to use the built-in list (happy-oyster,
      # lingbot-world-2, helios, lingbot, longlive-v2, sana-streaming). Lets us
      # ship a NEW Reactor model the moment it exists just by editing this value.
      - key: REACTOR_MODELS
        sync: false
      # Allow the web client to connect to ANY model name a tester types in, even
      # one not advertised above — so a brand-new Reactor model is usable instantly
      # ("1"/"true" to allow, "0"/"false" to lock to the advertised list).
      - key: REACTOR_ALLOW_CUSTOM_MODELS
        value: "1"
      # Default scene renderer: "reactor" (realtime video) or "image" (Gemini
      # stills). The web client auto-falls back to stills if Reactor is
      # unavailable, and can override per-session via ?renderer= / the toggle.
      - key: SCENE_RENDERER
        value: "reactor"
      - key: RESUME_MODE
        value: "1"
      - key: DISCORD_ENABLED
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
