# The gate on every push and pull request: the green suites stay green.
# tools/ci_suite.py runs tools/ci_suites.txt module by module in mock mode —
# no provider keys exist here and none are needed (the mock backend runs the
# whole loop offline). The browser e2e suites are not in the list; run them by
# hand (docs/operations/TESTING_USE_THIS.md).
name: ci

on:
  push:
    branches: [main, "dist/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install from the lock
        run: python -m pip install -r requirements.lock
      - name: Compile
        shell: pwsh
        run: python -m py_compile (Get-ChildItem *.py)
      - name: JavaScript syntax
        # check_js_syntax.py parses with Playwright's Chromium (no node here).
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
          python check_js_syntax.py
      - name: Green suites
        run: python tools/ci_suite.py
