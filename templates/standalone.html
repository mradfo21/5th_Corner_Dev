<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOMEWHERE // Standalone</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/standalone.css') }}?v={{ asset_version }}">
</head>
<body>

  <!-- Full-bleed scene crossfade layers. The image IS the game.
       No hardcoded seed art here (it 404'd); the pre-game backdrop is the
       CSS background + VHS grain until the first generated scene arrives. -->
  <div id="sceneA" class="scene scene-active"></div>
  <div id="sceneB" class="scene"></div>
  <!-- Reactor realtime world-model video layer (hidden until the realtime
       renderer is active). Sits above the still scene layers so the live
       stream replaces the still when connected, and the still shows through
       as a graceful fallback if Reactor is unavailable. -->
  <video id="reactor-video" class="reactor-video hidden" autoplay playsinline muted></video>
  <div id="scene-flash"></div>
  <div class="scene-scrim"></div>

  <!-- VHS overlay: grain + scanlines + tracking glitch + timecode -->
  <div id="vhs-overlay" class="vhs-on">
    <canvas id="vhs-grain"></canvas>
    <div id="scanlines"></div>
    <div id="vhs-tracking"></div>
    <div id="vhs-timecode">REC <span id="rec-dot">●</span> <span id="timecode-text">00:00:00</span></div>
  </div>

  <!-- VHS tape playback button (top-right) -->
  <button id="tape-btn" type="button" title="Play back the tape (T)">
    <span class="tape-tri"></span><span class="tape-btn-label">PLAY TAPE</span>
  </button>

  <!-- Auto-play: the world advances on its own, choosing a random action each turn -->
  <button id="autoplay-btn" type="button" title="Auto-play — advance on its own (P)">
    <span class="autoplay-dot"></span><span id="autoplay-label">AUTO-PLAY</span>
  </button>

  <!-- Tape playback overlay: plays this run's frames back in sequence -->
  <div id="tape-overlay" class="hidden">
    <div id="tape-frameA" class="tape-frame tape-frame-active"></div>
    <div id="tape-frameB" class="tape-frame"></div>
    <div id="tape-scanlines"></div>
    <div id="tape-hud">
      <span id="tape-rec">▶ PLAY</span>
      <span id="tape-counter">FRAME 0 / 0</span>
      <span id="tape-time">00:00:00</span>
    </div>
    <div id="tape-empty" class="hidden">NO FOOTAGE ON TAPE YET</div>
    <div id="tape-controls">
      <button id="tape-prev" class="tape-ctl" title="Previous frame">⏮</button>
      <button id="tape-playpause" class="tape-ctl" title="Play / pause">⏸</button>
      <button id="tape-next" class="tape-ctl" title="Next frame">⏭</button>
      <button id="tape-eject" class="tape-ctl tape-eject" title="Eject (Esc)">⏏ EJECT</button>
    </div>
  </div>

  <!-- Inventory HUD (hidden until the player picks something up) -->
  <aside id="inventory-hud" class="hidden">
    <div class="inv-label">PACK</div>
    <ul id="inventory-list"></ul>
  </aside>

  <!-- Narrative: floating top-left, no background -->
  <main id="prose-feed" aria-live="polite"></main>

  <!-- Minimal action zone: small options + free-will trigger at the bottom -->
  <div id="action-wheel">
    <div id="choices-container"></div>
    <form id="custom-form" autocomplete="off">
      <span class="prompt-caret">&gt;</span>
      <input id="custom-input" type="text" placeholder="type your own action..." maxlength="200">
      <button id="custom-submit" type="submit">SEND</button>
    </form>
    <button id="forward-btn" type="button" title="Move forward — a random action (↑ / Space)">
      <span class="forward-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21 V4"/>
          <path d="M6 10 L12 4 L18 10"/>
        </svg>
      </span>
    </button>
    <button id="free-will-btn" type="button" title="Type your own action (F)">
      <span class="fw-icon">✎</span><span class="fw-label">ACT</span>
    </button>
  </div>

  <!-- Tiny session controls -->
  <div id="console-controls">
    <button id="btn-reset" class="mini-btn" title="Restart (R)">⟲</button>
    <button id="btn-vhs" class="mini-btn" title="VHS (V)">▣</button>
    <button id="btn-snd" class="mini-btn" title="Sound (M)">♪</button>
    <button id="btn-renderer" class="mini-btn" title="Renderer: still / realtime (G)">◉</button>
  </div>

  <!-- Processing veil shown while waiting on the backend -->
  <div id="processing-veil" class="hidden">
    <div class="veil-inner">
      <div class="veil-spinner"></div>
      <div id="veil-message">Transmitting...</div>
    </div>
  </div>

  <!-- Death / game-over overlay -->
  <div id="death-overlay" class="hidden">
    <div class="death-inner">
      <div class="death-static"></div>
      <h1 class="death-title">YOU DIED</h1>
      <p id="death-message">The transmission ends.</p>
      <button id="death-restart" type="button">▶ RESTART SIMULATION</button>
      <div class="death-hint">press R to restart</div>
    </div>
  </div>

  <!-- Backend / connectivity tag -->
  <div id="backend-tag">backend: <span id="backend-name">—</span></div>

  <script src="{{ url_for('static', filename='js/reactor_renderer.js') }}?v={{ asset_version }}"></script>
  <script src="{{ url_for('static', filename='js/standalone.js') }}?v={{ asset_version }}"></script>
</body>
</html>
