<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOMEWHERE // Standalone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Load fonts without blocking first paint / the load event: fetch as a
     non-blocking stylesheet, then promote to a real stylesheet on load. The
     monospace fallback in CSS renders immediately if fonts are slow/unavailable. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap"></noscript>
<link rel="stylesheet" href="{{ url_for('static', filename='css/standalone.css') }}?v={{ asset_version }}">
</head>
<body>

  <!-- Full-bleed scene crossfade layers. The image IS the game.
       No hardcoded seed art here (it 404'd); the pre-game backdrop is the
       CSS background + VHS grain until the first generated scene arrives. -->
  <div id="sceneA" class="scene scene-active"></div>
  <div id="sceneB" class="scene"></div>
  <!-- Reactor realtime world-model video layer (hidden until the realtime
       renderer is active). Sits above the still scene layers so the live
       stream replaces the still when connected, and the still shows through
       as a graceful fallback if Reactor is unavailable. -->
  <video id="reactor-video" class="reactor-video hidden" autoplay playsinline muted></video>
  <!-- Realtime "back buffer": a canvas that holds the seed guide image (first
       scene) or the last live video frame (while re-anchoring onto a new guide
       image), so the live video can be re-staged underneath WITHOUT ever
       exposing a black gap or the underlying Gemini still. It fades out the
       instant genuinely new video frames arrive — a single-session double
       buffer. Only used by the realtime (reactor) renderer. -->
  <canvas id="reactor-freeze" class="reactor-freeze" aria-hidden="true"></canvas>
  <div id="scene-flash"></div>
  <!-- VCR distortion burst: a heavy static/tracking glitch fired over scene and
       video transitions (image swap, realtime re-anchor, reveal, reset) so the
       hand-off is masked like a tape jumping between segments. -->
  <div id="scene-glitch" aria-hidden="true"></div>
  <div class="scene-scrim"></div>

  <!-- VHS overlay: grain + scanlines + tracking glitch + timecode -->
  <div id="vhs-overlay" class="vhs-on">
    <canvas id="vhs-grain"></canvas>
    <div id="scanlines"></div>
    <div id="vhs-tracking"></div>
    <div id="vhs-timecode">REC <span id="rec-dot">●</span> <span id="timecode-text">00:00:00</span></div>
  </div>

  <!-- Control rail: every session control stacked in a vertical bar in the
       top-right, so nothing overlaps the prose text or gets blocked by the
       action field at the bottom. Icon + micro-label for clarity on PC/mobile. -->
  <nav id="control-rail" aria-label="Controls">
    <button id="btn-renderer" class="rail-btn" type="button" title="Realtime video on / still images (G)">
      <span class="rail-ico">◉</span><span class="rail-lbl">LIVE</span>
    </button>
    <button id="autoplay-btn" class="rail-btn" type="button" title="Auto-play — advance on its own (P)">
      <span class="rail-ico">⏩</span><span class="rail-lbl" id="autoplay-label">AUTO</span>
    </button>
    <button id="tape-btn" class="rail-btn" type="button" title="Play back the tape (T)">
      <span class="rail-ico">▤</span><span class="rail-lbl">TAPE</span>
    </button>
    <button id="btn-vhs" class="rail-btn" type="button" title="VHS overlay (V)">
      <span class="rail-ico">▣</span><span class="rail-lbl">VHS</span>
    </button>
    <button id="btn-snd" class="rail-btn" type="button" title="Sound (M)">
      <span class="rail-ico">♪</span><span class="rail-lbl">SND</span>
    </button>
    <button id="btn-reset" class="rail-btn rail-btn-danger" type="button" title="Restart (R)">
      <span class="rail-ico">⟲</span><span class="rail-lbl">NEW</span>
    </button>
  </nav>

  <!-- Tape playback overlay: plays this run's frames back in sequence -->
  <div id="tape-overlay" class="hidden">
    <div id="tape-frameA" class="tape-frame tape-frame-active"></div>
    <div id="tape-frameB" class="tape-frame"></div>
    <div id="tape-scanlines"></div>
    <div id="tape-hud">
      <span id="tape-rec">▶ PLAY</span>
      <span id="tape-counter">FRAME 0 / 0</span>
      <span id="tape-time">00:00:00</span>
    </div>
    <div id="tape-empty" class="hidden">NO FOOTAGE ON TAPE YET</div>
    <div id="tape-controls">
      <button id="tape-prev" class="tape-ctl" title="Previous frame">⏮</button>
      <button id="tape-playpause" class="tape-ctl" title="Play / pause">⏸</button>
      <button id="tape-next" class="tape-ctl" title="Next frame">⏭</button>
      <button id="tape-eject" class="tape-ctl tape-eject" title="Eject (Esc)">⏏ EJECT</button>
    </div>
  </div>

  <!-- Inventory HUD (hidden until the player picks something up) -->
  <aside id="inventory-hud" class="hidden">
    <div class="inv-label">PACK</div>
    <ul id="inventory-list"></ul>
  </aside>

  <!-- Narrative: floating top-left, no background -->
  <main id="prose-feed" aria-live="polite"></main>

  <!-- Minimal action zone: small options + free-will trigger at the bottom -->
  <div id="action-wheel">
    <div id="choices-container"></div>
    <form id="custom-form" autocomplete="off">
      <span class="prompt-caret">&gt;</span>
      <input id="custom-input" type="text" placeholder="type your own action..." maxlength="200">
      <button id="custom-submit" type="submit">SEND</button>
    </form>
    <button id="forward-btn" type="button" title="Play — advance the story (Space / ↑)">
      <span class="forward-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M8 5 L19 12 L8 19 Z"/>
        </svg>
      </span>
    </button>
    <button id="free-will-btn" type="button" title="Type your own action (F)">
      <span class="fw-icon">✎</span><span class="fw-label">ACT</span>
    </button>
    <!-- Realtime "SHAPE" tool (realtime mode only): submits a LIVE prompt that
         steers the running video instantly — a quick nudge to the world, as
         opposed to ACT/choices which resolve a full turn and change the scene. -->
    <button id="realtime-btn" type="button" title="Shape the live world — instant realtime nudge (H)">
      <span class="rt-icon">✋</span><span class="rt-label">TOUCH</span>
    </button>
  </div>

  <!-- (Session controls now live in #control-rail, top-right.) -->

  <!-- Processing veil shown while waiting on the backend. Hosts the gamified
       "ceremony" step tracker (the pipeline the world runs each turn) and a
       simple spinner fallback for boot/reset. -->
  <div id="processing-veil" class="hidden">
    <div class="veil-inner">
      <!-- Ceremony: the turn pipeline lights up step by step so the player
           feels the world working. Steps are built by standalone.js. -->
      <div id="ceremony" class="ceremony hidden" aria-live="polite">
        <ol id="ceremony-steps" class="ceremony-steps"></ol>
        <div id="ceremony-note" class="ceremony-note"></div>
      </div>
      <!-- Simple fallback (reset / boot). -->
      <div id="veil-simple" class="veil-simple">
        <div class="veil-spinner"></div>
        <div id="veil-message">Transmitting...</div>
      </div>
    </div>
  </div>

  <!-- Death / game-over overlay -->
  <div id="death-overlay" class="hidden">
    <div class="death-inner">
      <div class="death-static"></div>
      <h1 class="death-title">YOU DIED</h1>
      <p id="death-message">The transmission ends.</p>
      <button id="death-restart" type="button">▶ RESTART SIMULATION</button>
      <div class="death-hint">press R to restart</div>
    </div>
  </div>

  <!-- Backend / connectivity tag -->
  <div id="backend-tag">backend: <span id="backend-name">—</span></div>

  {% if forced_renderer %}<script>window.__FORCED_RENDERER__ = "{{ forced_renderer }}";</script>{% endif %}
  <script src="{{ url_for('static', filename='js/reactor_renderer.js') }}?v={{ asset_version }}"></script>
  <script src="{{ url_for('static', filename='js/standalone.js') }}?v={{ asset_version }}"></script>
</body>
</html>
