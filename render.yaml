services:
  # Single combined service: API + Discord bot.
  #
  # NOTE: The previous version of this file declared `type: worker`, which on
  # Render means no public URL and no inbound HTTP. That is incompatible with
  # the API server (`api.py`), the `/admin` dashboard, and Render health
  # checks. We use `type: web` so the API is reachable AND the bot keeps
  # running alongside it.
  - type: web
    name: somewhere-discord-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # `start_production.sh` launches the Discord bot in the background and
    # serves the Flask API with gunicorn (production WSGI server) instead of
    # Flask's dev server with debug=True. Don't change this without updating
    # both processes — Render's health probe targets the API.
    startCommand: bash start_production.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Reactor realtime world-model renderer (optional). REACTOR_API_KEY is a
      # secret used only server-side to mint short-lived browser tokens.
      - key: REACTOR_API_KEY
        sync: false
      # ElevenLabs Conversational AI — powers the SCAN "TALK" mechanic (speak to
      # people/characters/things the scanner flags as able to talk). The default
      # AGENT_ID below is a PUBLIC agent, so live voice works out of the box with
      # NO secret. ELEVENLABS_API_KEY is OPTIONAL: set it only if you repoint
      # AGENT_ID at a PRIVATE agent (the server then mints short-lived signed
      # URLs; the key never reaches the browser).
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_AGENT_ID
        value: "agent_1601kxh3rz2hej9swfs75dv33q78"
      # "0" if you repoint AGENT_ID at an agent that does NOT allow prompt/
      # first-message overrides in its Security settings (else the widget errors;
      # dynamic variables still keep it story-aware).
      - key: ELEVENLABS_ALLOW_OVERRIDES
        value: "1"
      - key: REACTOR_MODEL
        value: "reactor/lingbot-world-2"
      # Default world model the mid-game switcher starts on ("lingbot-world-2"
      # or "helios"). Players can flip between them live from the WORLD MODEL log.
      - key: REACTOR_WORLD_MODEL
        value: "lingbot-world-2"
      # SDK model name for Helios (the second model in the base pair).
      - key: REACTOR_HELIOS_MODEL
        value: "reactor/helios"
      # Add/replace the entire advertised world-model list with pure config (no
      # code change) — a JSON array of {id,label,sdk_name,requires_seed_image,
      # protocol}. Leave unset to use the built-in list (lingbot-world-2, helios,
      # lingbot, longlive-v2, sana-streaming). Lets us ship a NEW Reactor model
      # the moment it exists just by editing this value.
      - key: REACTOR_MODELS
        sync: false
      # Allow the web client to connect to ANY model name a tester types in, even
      # one not advertised above — so a brand-new Reactor model is usable instantly
      # ("1"/"true" to allow, "0"/"false" to lock to the advertised list).
      - key: REACTOR_ALLOW_CUSTOM_MODELS
        value: "1"
      # Default scene renderer: "reactor" (realtime video) or "image" (Gemini
      # stills). The web client auto-falls back to stills if Reactor is
      # unavailable, and can override per-session via ?renderer= / the toggle.
      - key: SCENE_RENDERER
        value: "reactor"
      - key: RESUME_MODE
        value: "1"
      - key: DISCORD_ENABLED
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
